<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Teste de Sprite</title>
  <style>
    body {
      background: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #eee;
      font-family: sans-serif;
    }
    canvas {
      image-rendering: pixelated;
      background: #333;
      border: 2px solid #555;
    }
  </style>
</head>
<body>
  <p>Use as <strong>Setas (← / →)</strong> para andar e <strong>Espaço</strong> para atacar</p>
  <canvas id="game" width="400" height="300"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const sprite = new Image();
    sprite.src = './html/personagem_principal.png';

    const COLS = 4;
    const ROWS = 2;

    let frameWidth = 0;
    let frameHeight = 0;

    sprite.onload = () => {
      frameWidth = sprite.width / COLS;
      frameHeight = sprite.height / ROWS;
      requestAnimationFrame(loop);
    };

    let posX = 150;
    let currentAnim = 'idle'; // 'idle', 'walk', 'attack'
    let currentFrame = 0;
    let frameTimer = 0;
    const frameSpeed = 8; // velocidade da troca de quadros

    const keys = {};
    window.addEventListener('keydown', (e) => (keys[e.code] = true));
    window.addEventListener('keyup', (e) => (keys[e.code] = false));

    function update() {
      // Estado de ataque
      if (keys['Space'] && currentAnim !== 'attack') {
        currentAnim = 'attack';
        currentFrame = 0;
        frameTimer = 0;
      }

      if (currentAnim === 'attack') {
        frameTimer++;
        if (frameTimer >= frameSpeed) {
          frameTimer = 0;
          currentFrame++;
          if (currentFrame >= COLS) {
            currentAnim = 'idle';
            currentFrame = 0;
          }
        }
        return;
      }

      // Estado de caminhada ou parado
      if (keys['ArrowRight']) {
        posX += 2;
        currentAnim = 'walk';
      } else if (keys['ArrowLeft']) {
        posX -= 2;
        currentAnim = 'walk';
      } else {
        currentAnim = 'idle';
      }

      if (currentAnim === 'walk') {
        frameTimer++;
        if (frameTimer >= frameSpeed) {
          frameTimer = 0;
          currentFrame = (currentFrame + 1) % COLS;
        }
      } else {
        currentFrame = 0;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const row = currentAnim === 'attack' ? 1 : 0;
      const col = currentFrame;

      const sx = col * frameWidth;
      const sy = row * frameHeight;

      // Desenha com escala ampliada (x3) para manter o visual pixel art
      const scale = 3;
      ctx.drawImage(
        sprite,
        sx, sy, frameWidth, frameHeight,
        posX, 120, frameWidth * scale, frameHeight * scale
      );
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
