<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Masmorra" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#090a0f" />
  <link rel="manifest" href="/manifest.json" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Masmorra de Bolso - Roguelite 2D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #090a0f;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace, system-ui, sans-serif;
    }

    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #090a0f;
    }

    /* Renderização pixel-art nítida sem borrões e otimização para telas touch */
    canvas {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    :fullscreen, ::backdrop {
      background-color: #090a0f;
    }

    #rotate-device {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #090a0f;
      z-index: 999999;
      color: #38bdf8;
      font-family: monospace;
      text-align: center;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    @keyframes rotateIconAnim {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }

    .rotate-icon {
      font-size: 52px;
      margin-bottom: 16px;
      animation: rotateIconAnim 2s infinite ease-in-out;
      display: inline-block;
    }

    @media screen and (orientation: portrait) and (max-width: 850px) {
      #rotate-device {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="rotate-device">
    <span class="rotate-icon">📱↻</span>
    <div style="font-size: 16px; font-weight: bold; color: #4ade80; margin-bottom: 10px;">GIRE O CELULAR</div>
    <div style="font-size: 12px; color: #cbd5e1; line-height: 1.5; max-width: 280px;">
      Vire o celular na horizontal (modo paisagem) para jogar em tela cheia sem barras pretas!
    </div>
  </div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
