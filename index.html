<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Masmorra" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#090a0f" />
  <link rel="manifest" href="/manifest.json" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Masmorra de Bolso - Roguelite 2D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: 100vh;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #090a0f;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace, system-ui, sans-serif;
    }

    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #090a0f;
    }

    /* Renderização pixel-art nítida sem borrões e otimização para telas touch */
    canvas {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      cursor: crosshair;
    }
    :fullscreen, ::backdrop {
      background-color: #090a0f;
    }

    #rotate-device {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #090a0f;
      z-index: 999999;
      color: #38bdf8;
      font-family: monospace;
      text-align: center;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    @keyframes rotatePhoneAnim {
      0%, 15% { transform: rotate(0deg); }
      55%, 85% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }

    .rotate-phone-box {
      width: 44px;
      height: 76px;
      border: 3px solid #38bdf8;
      border-radius: 8px;
      position: relative;
      margin-bottom: 20px;
      animation: rotatePhoneAnim 2.2s infinite ease-in-out;
      background: #0f172a;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.35);
    }

    .rotate-phone-box::after {
      content: '';
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 3px;
      border-radius: 2px;
      background: #38bdf8;
    }

    @media screen and (orientation: portrait) and (max-width: 900px) {
      #rotate-device {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="rotate-device">
    <div class="rotate-phone-box"></div>
    <div style="font-size: 16px; font-weight: bold; color: #4ade80; margin-bottom: 10px; letter-spacing: 1px;">GIRE O CELULAR</div>
    <div style="font-size: 12px; color: #cbd5e1; line-height: 1.5; max-width: 260px;">
      Vire o aparelho na horizontal (modo paisagem) para jogar em tela cheia!
    </div>
  </div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
